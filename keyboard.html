<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Assignment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/keyboard.css">
</head>
<body>
    <div class="containner">    
              <div class="top">
                 <div class="keyboard">
                     <div class="small">
                        <button class="esc">Esc</button>
                        <button class="small-div">
                           <p></p>
                           <p>F1</p>
                        </button>
                        <button class="small-div">F2</button>
                        <button class="small-div">F3</button>
                        <button class="small-div">F4</button>
                        <button class="small-div">F5</button>
                        <button class="small-div">F6</button>
                        <button class="small-div">F7</button>
                        <button class="small-div">F8</button>
                        <button class="small-div">F9</button>
                        <button class="small-div-two">
                           <p>prt sc</p>
                           <p>F10</p>
                        </button>
                        <button class="small-div-two">
                           <p>home</p>
                           <p>F11</p>
                        </button>
                        <button class="small-div-two">
                           <p>end</p>
                           <p>F12</p>
                        </button>
                        <button class="small-div-two">
                           <p>insert</p> 
                        </button>
                        <button class="small-div-two">
                           <p>delete</p>
                        </button>
                     </div>
                     <div class="normal1">
                        <button class="normal-div">
                           <p class="big">~</p>
                           <p class="big">`</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p>!</p>
                           <p class="big-less">1</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p class="lift">@</p>
                           <p class="big-less">2</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p class="lift">#</p>
                           <p class="big-less">3</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p class="lift">$</p>
                           <p class="big-less">4</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p class="lift">%</p>
                           <p class="big-less">5</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p>^</p>
                           <p class="big-less">6</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p class="lift">&</p>
                           <p class="big-less">7</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p>*</p>
                           <p class="big-less">8</p>
                        </button>
                        <button class="normal-div">
                           <p>(</p>
                           <p class="big-less">9</p>
                        </button>
                        <button class="normal-div">
                            <p>)</p>
                           <p class="big-less">0</p>
                        </button>
                        <button class="normal-div-tiny-gap">
                           <p class="big">_</p>
                           <p class="big lift">-</p>
                        </button>
                        <button class="normal-div-tiny-gap">
                           <p class="big-less">+</p>
                           <p class="big-less up">=</p>
                        </button>
                        <button class="normal-div1">
                           <p>backspace</p>
                        </button>
                     </div>
                     <div class="normal">
                        <button class="normal-div2">tab</button>
                        <button class="normal-div-caps">Q</button>
                        <button class="normal-div-caps">W</button>
                        <button class="normal-div-caps">E</button>
                        <button class="normal-div-caps">R</button>
                        <button class="normal-div-caps">T</button>
                        <button class="normal-div-caps">Y</button>
                        <button class="normal-div-caps">U</button>
                        <button class="normal-div-caps">I</button>
                        <button class="normal-div-caps">O</button>
                        <button class="normal-div-caps">P</button>
                        <button class="normal-div">
                           <p>{</p>
                           <p class="shift-little">[</p>
                        </button>
                        <button class="normal-div">
                           <p>}</p>
                           <p class="shift-right">]</p>
                        </button>
                        <button class="normal-div">
                           <p>|</p>
                           <p class="shift-little">\</p>
                        </button>
                     </div>
                     <div class="normal">
                        <button class="normal-div3">
                           <p class="normal-div3-dot">.</p>
                           <p>caps lock</p>
                        </button>
                        <button class="normal-div-caps">A</button>
                        <button class="normal-div-caps">S</button>
                        <button class="normal-div-caps">D</button>
                        <button class="normal-div-caps">F</button>
                        <button class="normal-div-caps">G</button>
                        <button class="normal-div-caps">H</button>
                        <button class="normal-div-caps">J</button>
                        <button class="normal-div-caps">K</button>
                        <button class="normal-div-caps">L</button>
                        <button class="normal-div-small-gap">
                           <p class="big-less">:</p>
                           <p class="up big-less">;</p>
                        </button>
                        <button class="normal-div-small-gap">
                           <p class="down big">"</p>
                           <p class="big">'</p>
                        </button>
                        <button class="normal-div3 shift-right-bigger">enter</button>
                     </div>
                     <div class="normal">
                        <button class="normal-div-shift">shift</button>
                        <button class="normal-div-caps">Z</button>
                        <button class="normal-div-caps">X</button>
                        <button class="normal-div-caps">C</button>
                        <button class="normal-div-caps">V</button>
                        <button class="normal-div-caps">B</button>
                        <button class="normal-div-caps">N</button>
                        <button class="normal-div-caps">M</button>
                        <button class="normal-div-tiny-gap">
                           <P class="down"><</P>
                           <P class="lift">,</P>
                        </button>
                        <button class="normal-div-tiny-gap ">
                           <P>></P>
                           <P>.</P>
                        </button>
                        <button class="normal-div ">
                           <P>?</P>
                           <P>/</P>
                        </button>
                        <button class="normal-div-shift more-left">shift</button>
                     </div>
                     <div class="normal-last">
                        <button class="normal-div-ctrl">ctrl</button>
                        <button class="normal-div">fn</button>
                        <button class="normal-div">
                         <i class="fa-brands fa-windows"></i>
                        </button>
                        <button class="normal-div">alt</button>
                        <button class="normal-div-space"></button>
                        <button class="normal-div">alt</button>
                        <button class="normal-div">ctrl</button>
                        <div class="normal-div-ctrl-split">
                           <button>
                              <p>page</p>
                              <p>up</p>
                           </button>
                           <button>left</button>
                        </div>
                        <div class="normal-div-ctrl-split">
                           <button style="font-size: 15px;">up</button>
                           <button>down</button>
                        </div>
                        <div class="normal-div-ctrl-split">
                           <button>
                              <p>page</p>
                              <p>down</p>
                           </button>
                           <button>right</button>
                        </div>
                     </div>
                 </div>
              </div>             
    </div>
</body>
</html>
